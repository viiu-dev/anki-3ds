name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Wait for the same commit's main-branch build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 120); do
            run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push" --jq '.workflow_runs | map(select(.head_branch == "main")) | first | .id // empty')
            if [[ -n "$run_id" ]]; then
              status=$(gh run view "$run_id" --json status --jq .status)
              if [[ "$status" == completed ]]; then
                conclusion=$(gh run view "$run_id" --json conclusion --jq .conclusion)
                [[ "$conclusion" == success ]] || { echo "Build failed: $conclusion"; exit 1; }
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 15
          done
          echo 'No successful main-branch build for this tag commit.' >&2
          exit 1
      - name: Download and verify build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.build.outputs.run_id }}
        run: |
          gh run download "$RUN_ID" --name "native-$GITHUB_SHA" --dir release
          cd release
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import json, os
          info = json.load(open('manifest.json'))
          assert info['source_revision'] == os.environ['GITHUB_SHA']
          assert not info['source_dirty']
          assert 'v' + info['version'] == os.environ['GITHUB_REF_NAME']
          PY
      - name: Generate FBI QR code for CIA asset
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qrencode
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/anki-3ds.cia"
          qrencode -o release/anki-3ds-cia-qr.png -s 10 -m 4 -l M "$url"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'Release already exists; preserving its existing assets and checksums.'
            exit 0
          fi
          extra_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            extra_flags+=(--prerelease)
          fi
          if [[ "$GITHUB_REF_NAME" == "v1.0.0" ]]; then
            extra_flags+=(--notes "")
          else
            extra_flags+=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" \
            release/anki-3ds.cia \
            release/anki-3ds.3dsx \
            release/anki-3ds-cia-qr.png \
            --verify-tag --draft --title "Anki 3DS $GITHUB_REF_NAME" \
            "${extra_flags[@]}"
      - name: Update README install QR on main
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          cp release/anki-3ds-cia-qr.png 3ds/docs/images/install-qr.png
          if ! git diff --quiet -- 3ds/docs/images/install-qr.png; then
            git add 3ds/docs/images/install-qr.png
            git commit -m "docs(3ds): update install QR for $GITHUB_REF_NAME [skip ci]"
            git push origin HEAD:main
          fi
